services:

  api-gateway:
    build:
      context: ../gateway/api-gateway
    env_file:
      - ../gateway/api-gateway/.env
    ports:
      - "8080:8080"
    networks:
      - app-network

  security-service:
    build:
      context: ../services/security-service
    env_file:
      - ../services/security-service/.env
    ports:
      - "8081:8080"
    networks:
      - app-network

  saga-orchestrator:
    build:
      context: ../services/saga-orchestrator
    env_file:
      - ../services/saga-orchestrator/.env
    volumes:
      - ../services/saga-orchestrator/secrets:/app/secrets:ro
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  customer-service:
    build:
      context: ../services/customer-service
    env_file:
      - ../services/customer-service/.env
    ports:
      - "8083:8080"
    networks:
      - app-network

  event-service:
    build:
      context: ../services/event-service
    env_file:
      - ../services/event-service/.env
    ports:
      - "8084:8080"
    networks:
      - app-network

  payment-service:
    build:
      context: ../services/payment-service
    env_file:
      - ../services/payment-service/.env
    ports:
      - "8085:8080"
    networks:
      - app-network

  notification-service:
    build:
      context: ../services/notification-service
    env_file:
      - ../services/notification-service/.env
    volumes:
      - ../services/notification-service/secrets:/app/secrets:ro
    ports:
      - "8086:8080"
    depends_on:
      mailpit:
        condition: service_healthy
    networks:
      - app-network
      
  aggregator-service:
    build:
      context: ../services/aggregator-service
    env_file:
      - ../services/aggregator-service/.env
    ports:
      - "8087:8080"
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "8025:8025" # Web UI & API
      - "1025:1025" # SMTP Server
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network
      
# --- zrok2 public tunnel for saga-orchestrator webhooks ---

      
networks:
  app-network:
    driver: bridge
    
volumes:
  zrok_env: