services:

  api-gateway:
    build:
      context: ../gateway/api-gateway
    env_file:
      - ../gateway/api-gateway/.env
    ports:
      - "8080:8080"
    networks:
      - app-network

  security-service:
    build:
      context: ../services/security-service
    env_file:
      - ../services/security-service/.env
    ports:
      - "8081:8080"
    networks:
      - app-network

  saga-orchestrator:
    build:
      context: ../services/saga-orchestrator
    env_file:
      - ../services/saga-orchestrator/.env
    ports:
      - "8082:8080"
    networks:
      - app-network

  customer-service:
    build:
      context: ../services/customer-service
    env_file:
      - ../services/customer-service/.env
    ports:
      - "8083:8080"
    networks:
      - app-network

  event-service:
    build:
      context: ../services/event-service
    env_file:
      - ../services/event-service/.env
    ports:
      - "8084:8080"
    networks:
      - app-network

  payment-service:
    build:
      context: ../services/payment-service
    env_file:
      - ../services/payment-service/.env
    ports:
      - "8085:8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge