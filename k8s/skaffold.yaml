        dockerfile: Dockerfile
      hooks:
        after:
          - command:
              - powershell.exe
              - -NoProfile
              - -Command
              - 'kind load docker-image $env:SKAFFOLD_IMAGE --name laughing-enigma; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
            os: [windows]

    - image: laughing-enigma/aggregator-service
      context: services/aggregator-service
      docker:
        dockerfile: Dockerfile
      hooks:
        after:
          - command:
              - powershell.exe
              - -NoProfile
              - -Command
              - 'kind load docker-image $env:SKAFFOLD_IMAGE --name laughing-enigma; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
