
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: laughing-enigma

build:
  artifacts:

    - image: laughing-enigma/angular-app
      context: frontend/visual-enigma
      docker:
        dockerfile: Dockerfile
      hooks:
        after:
          - command:
              - powershell.exe
              - -NoProfile
              - -Command
              - 'kind load docker-image $env:SKAFFOLD_IMAGE --name laughing-enigma; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
            os: [windows]

    - image: laughing-enigma/api-gateway
      context: gateway/api-gateway
      docker:
        dockerfile: Dockerfile
      hooks:
        after:
          - command:
              - powershell.exe
              - -NoProfile
              - -Command
              - 'kind load docker-image $env:SKAFFOLD_IMAGE --name laughing-enigma; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
            os: [windows]

    - image: laughing-enigma/security-service
      context: services/security-service
      docker:
        dockerfile: Dockerfile
      hooks:
        after:
          - command:
              - powershell.exe
              - -NoProfile
              - -Command
              - 'kind load docker-image $env:SKAFFOLD_IMAGE --name laughing-enigma; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
            os: [windows]

    - image: laughing-enigma/saga-orchestrator
      context: services/saga-orchestrator
      docker:
        dockerfile: Dockerfile
      hooks:
        after:
          - command:
              - powershell.exe
              - -NoProfile
