
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: laughing-enigma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: laughing-enigma/api-gateway
          ports:
            - containerPort: 8080
              name: http
          imagePullPolicy: IfNotPresent
