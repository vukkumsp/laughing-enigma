server:
  port: 8999

spring:
  application:
    name: saga-orchestrator
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      # 1. Test connections before handing them out
      connection-test-query: SELECT 1
      # 2. Maximum time to wait for connection validation check (ms)
      validation-timeout: 3000
      # 3. Maximum time a thread waits to get a connection from the pool (ms)
      connection-timeout: 10000
      # 4. Retire connections before the network/firewall silently drops them (ms)
      max-lifetime: 600000 # 10 minutes
      # 5. Evict idle connections faster (ms)
      idle-timeout: 300000 # 5 minutes
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: false
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
      ssl.truststore.type: PEM
      ssl.truststore.location: ${KAFKA_CA_PATH}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

customer:
  service: ${CUSTOMER_SERVICE_URL}
event:
  service: ${EVENT_SERVICE_URL}