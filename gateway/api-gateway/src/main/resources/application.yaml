server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway.server.webflux:
      routes:
        - id: security-service
          uri: https://jsonplaceholder.typicode.com
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/auth/?(?<segment>.*), /$\{segment}
