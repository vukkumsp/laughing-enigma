server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always

app:
  services:
    customer:
      url: ${CUSTOMER_SERVICE_URL}
    security:
      url: ${SECURITY_SERVICE_URL}
    event:
      url: ${EVENT_SERVICE_URL}
    saga:
      url: ${SAGA_ORCHESTRATOR_URL}

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${VALKEY_HOST}
      port: ${VALKEY_PORT}
      username: ${VALKEY_USERNAME}
      password: ${VALKEY_PASSWORD}
      ssl:
        enabled: true

  cloud:
    circuitbreaker:
      resilience4j:
        # Enable Resilience4j TimeLimiter.
        # TimeLimiter controls individual request duration
        # CircuitBreaker controls whether calls should continue to be attempted.
        disable-time-limiter: false
    gateway.server.webflux:
      filter:
        # This will removes these filter beans from adding into container
        # We use DisabledFilterStripper to remove these references as well at runtime.
        circuit-breaker:
          enabled: ${GATEWAY_CB_ENABLED:true}
        request-rate-limiter:
          enabled: ${GATEWAY_RATELIMIT_ENABLED:true}
      routes:
        # =========================
        # SECURITY
        # =========================
        - id: security-service
          uri: ${SECURITY_SERVICE_URL}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: securityServiceCircuitBreaker
                fallbackUri: forward:/fallback/security

            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # =========================
        # CUSTOMER
        # =========================
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL}
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - name: CircuitBreaker
              args:
                name: customerServiceCircuitBreaker
                fallbackUri: forward:/fallback/customer

            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # =========================
        # EVENTS
        # =========================
        - id: event-service
          uri: ${EVENT_SERVICE_URL}
          predicates:
            - Path=/api/v1/events/**
          filters:
            - name: CircuitBreaker
              args:
                name: eventServiceCircuitBreaker
                fallbackUri: forward:/fallback/event

            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # =========================
        # REGISTRATION / SAGA
        # =========================
        - id: saga-orchestrator
          uri: ${SAGA_ORCHESTRATOR_URL}
          predicates:
            - Path=/api/v1/registrations
            - Method=POST
          filters:
            - name: CircuitBreaker
              args:
                name: sagaServiceCircuitBreaker
                fallbackUri: forward:/fallback/saga

            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
        # =========================
        # SSE CONNECTION FOR SAGA REGISTRATION
        # =========================
        - id: saga-orchestrator-sse
          uri: ${SAGA_ORCHESTRATOR_URL}
          predicates:
            - Path=/api/v1/registrations/*/events
            - Method=GET
          filters:
            # Don't add circuit breaker as SSE is long lived connection
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

jwt:
  public-key: ${JWT_PUBLIC_KEY}

visual:
  enigma: ${VISUAL_ENGIMA_URL}

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: true
  circuitbreaker:
    instances:
      securityServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

      customerServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

      eventServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

      sagaServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.filter.ratelimit: DEBUG