server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway.server.webflux:
      routes:
        - id: security-service
          uri: http://localhost:8082
          predicates:
            - Path=/auth/**

        - id: customer-service
          uri: http://localhost:8083
          predicates:
            - Path=/customers/**

jwt:
  public-key: ${JWT_PUBLIC_KEY}